name: Release

# Si attiva solo quando si crea un tag come v0.4.0. Controlla che il tag e la versione di info.xml siano uguali,
# costruisce il pacchetto da installare in Nextcloud e lo allega alla release su GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pacchetto:
    name: Pacchetto per Nextcloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # serve solo per creare la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: La versione del tag deve essere quella di info.xml
        run: |
          set -e
          versione=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)
          echo "tag: ${GITHUB_REF_NAME}  info.xml: ${versione}"
          test "${GITHUB_REF_NAME}" = "v${versione}"
          echo "VERSIONE=${versione}" >> "$GITHUB_ENV"
      - name: Costruisco il pacchetto
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pkg/edithstudio"
          tar --exclude-vcs --exclude='./.github' --exclude='./scripts' -cf - . | tar -xf - -C "$RUNNER_TEMP/pkg/edithstudio"
          tar -czf "edithstudio-${VERSIONE}.tar.gz" -C "$RUNNER_TEMP/pkg" edithstudio
          sha256sum "edithstudio-${VERSIONE}.tar.gz" | tee "edithstudio-${VERSIONE}.tar.gz.sha256"
      - name: Pubblico la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "edithstudio-${VERSIONE}.tar.gz" "edithstudio-${VERSIONE}.tar.gz.sha256" \
            --title "EDITH Studio ${VERSIONE}" --generate-notes --verify-tag
